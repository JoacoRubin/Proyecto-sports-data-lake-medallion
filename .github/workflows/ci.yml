# =============================================================================
# ci.yml — Corre la suite de tests en cada push y pull request.
#
# POR QUE EXISTE
# ---------------
# refresh-ml.yml y refresh-thesportsdb.yml corren con cron y commitean datos:
# no son CI, no corren en push/PR, no bloquean nada. Antes de este workflow
# los 256 tests de tests/ solo corrian si alguien se acordaba de correrlos a
# mano — el punto que ya señalaba Martin: "que el codigo funcione no
# significa que el modelo funcione bien", pero antes ni siquiera "el codigo
# funciona" estaba garantizado en cada push.
#
# QUE CUBRE
# ---------
# La suite completa ya incluye contratos Pandera (quality/contracts), tests
# de ML (leakage, calibracion, quality gate de promocion, registry) y el
# contrato HTTP de la inference API — no hace falta un paso separado por
# capa, pytest ya los corre todos juntos.
#
# El segundo job buildea las dos imagenes de Docker. No es cosmetico: la
# primera vez que se armaron Dockerfile.api/.dashboard, un mismatch de
# version de Python (3.11 vs la 3.14 que pide requirements.txt) rompio el
# build y nadie se hubiera enterado hasta el proximo deploy manual. Este job
# es lo que hubiera atajado eso en el momento del commit.
#
# QUE NO CUBRE (a proposito)
# ----------------------------
# No reentrena los modelos contra el dataset real: eso ya lo hace
# refresh-ml.yml semanalmente contra datos reales, y duplicarlo aca en cada
# push seria caro y redundante — tests/test_ml_promotion.py ya prueba el
# quality gate con metricas sinteticas, sin necesitar Delta ni 18k partidos.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias de desarrollo (nucleo + api + tests)
        run: python -m pip install -r requirements-dev.txt

      - name: Correr la suite completa
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build inference API
        run: docker build -f Dockerfile.api -t inference-api .

      - name: Build dashboard
        run: docker build -f Dockerfile.dashboard -t dashboard .
